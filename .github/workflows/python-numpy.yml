name: Python and NumPy bindings
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build shared library
        run: |
          cmake -S . -B build -DFREEIMAGE_STATIC=OFF -DBUILD_TESTS=OFF -DCMAKE_CXX_STANDARD=11 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $library = Get-ChildItem build -Recurse -File | Where-Object { $_.Name -in @('FreeImage.dll', 'libFreeImage.so', 'libFreeImage.dylib') } | Select-Object -First 1
          if (-not $library) { throw 'Shared library was not produced' }
          "FREEIMAGE_LIBRARY=$($library.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install package and build wheel
        run: |
          python -m pip install ./bindings/python
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip wheel --no-deps ./bindings/python --wheel-dir dist
      - name: Test installed package
        run: python -m unittest discover -s bindings/python/tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.os }}
          path: dist/*.whl
