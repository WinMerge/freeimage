[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "FreeImage"
version = "3.19.25"
description = "Optional NumPy bindings for FreeImage"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]
license = {text = "FreeImage Public License or GPL-2.0"}

[project.urls]
Homepage = "https://github.com/danoli3/FreeImage"
Repository = "https://github.com/danoli3/FreeImage"
Issues = "https://github.com/danoli3/FreeImage/issues"

[tool.setuptools]
license-files = ["license-fi.txt", "license-gplv2.txt"]

[tool.setuptools.packages.find]
include = ["freeimage_numpy*"]
